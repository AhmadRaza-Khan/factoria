[package]
name = "factoria"
description = "Async test data factories for Rust (SeaORM, sqlx) - like factory_bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["factory", "testing", "fixtures", "seaorm", "sqlx"]
categories = ["development-tools::testing", "database"]

# Features "sqlx" and "derive" and their dependencies are added alongside
# their adapters in steps 06-07.
[features]
default = []
sea-orm = ["dep:sea-orm"]

[dependencies]
sea-orm = { version = "2", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }

[[test]]
name = "sea_orm"
required-features = ["sea-orm"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
