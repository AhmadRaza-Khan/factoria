[package]
name = "factoria"
description = "Async test data factories for Rust (SeaORM, sqlx)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["factory", "testing", "fixtures", "seaorm", "sqlx"]
categories = ["development-tools::testing", "database"]

[features]
default = []
sea-orm = ["dep:sea-orm"]
sqlx = ["dep:sqlx"]
derive = ["dep:factoria-derive", "dep:fake"]

[dependencies]
factoria-derive = { version = "0.1.0", path = "../factoria-derive", optional = true }
fake = { version = "5", optional = true }
sea-orm = { version = "2", default-features = false, optional = true }
sqlx = { version = "0.9", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
fake = { version = "5", features = ["derive"] }
trybuild = "1"

[[test]]
name = "sea_orm"
required-features = ["sea-orm"]

[[test]]
name = "patterns"
required-features = ["sea-orm"]

[[test]]
name = "sqlx"
required-features = ["sqlx"]

[[test]]
name = "derive"
required-features = ["derive"]

[[example]]
name = "seaorm_basic"
required-features = ["sea-orm"]

[[example]]
name = "sqlx_basic"
required-features = ["sqlx"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
